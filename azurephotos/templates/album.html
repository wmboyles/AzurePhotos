{% extends 'base.html' %}

{% block jsinit %}
<script type="text/javascript">
  let album = {{album | tojson}};
  let albums = {{ albums | tojson }};
</script>
{% endblock %}

{% block title %}
<header class="container-fluid d-flex align-items-center gap-3">
  <a href="/#albums" class="btn btn-outline-secondary icon-button">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h1 class="mb-0 text-truncate flex-grow-1">{{ album }}</h1>
  <div class="dropdown">
    <button type="button" class="btn btn-outline-secondary icon-button" data-bs-toggle="dropdown" aria-label="Album actions">
      <i class="bi bi-three-dots"></i>
    </button>
    <ul class="dropdown-menu dropdown-menu-end">
      <li>
        <button type="button" class="dropdown-item" id="renameAlbumBtn">Rename Album</button>
      </li>
      <li>
        <button type="button" class="dropdown-item text-danger" id="deleteAlbumBtn">Delete Album</button>
      </li>
    </ul>
  </div>
</header>
{% endblock %}

<!-- Don't need to list other albums on album page -->
{% block albums %}
{% endblock %}
