{% extends 'base.html' %}

{% block jsinit %}
<script type="text/javascript">
  let album = {{album | tojson}};
  let albums = {{ albums | tojson }};
</script>
{% endblock %}

{% block title %}
<a href="/#albums" class="btn btn-outline-secondary icon-button" aria-label="Back to albums">
  <i class="bi bi-arrow-left" aria-hidden="true"></i>
</a>
<h1 class="app-title h5 mb-0 fw-semibold text-truncate flex-grow-1">{{ album }}</h1>
<div class="dropdown">
  <button type="button" class="btn btn-outline-secondary icon-button" data-bs-toggle="dropdown" aria-label="Album actions">
    <i class="bi bi-three-dots" aria-hidden="true"></i>
  </button>
  <ul class="dropdown-menu dropdown-menu-end">
    <li>
      <button type="button" class="dropdown-item" id="renameAlbumBtn">Rename Album</button>
    </li>
    <li>
      <button type="button" class="dropdown-item text-danger" id="deleteAlbumBtn">Delete Album</button>
    </li>
  </ul>
</div>
{% endblock %}
