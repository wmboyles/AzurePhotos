<div class="modal fade" id="fullsizeModal" tabindex="-1" aria-labelledby="fullsizeModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-fullscreen">
    <div class="modal-content text-white">
      <div class="modal-header border-0 p-0">
        <button type="button" class="btn icon-button" data-bs-dismiss="modal" aria-label="Close viewer">
          <i class="bi bi-x-lg text-white" aria-hidden="true"></i>
        </button>
        <h2 class="modal-title app-title fs-6 text-truncate flex-grow-1" id="fullsizeModalLabel">Photo Title</h2>
      </div>
      <div class="modal-body py-0 px-0 d-flex align-items-center justify-content-center overflow-hidden" id="fullsizeModalBody" aria-busy="false">
        <!-- Img or video will be added here -->
      </div>
      <div class="viewer-notice small flex-shrink-0 p-3 bg-dark" id="viewerNotice" role="status" hidden></div>
      <section class="viewer-info flex-shrink-0 p-3 bg-dark" id="viewerInfoPanel" aria-labelledby="viewerInfoHeading" hidden>
        <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
          <h3 class="h6 mb-0" id="viewerInfoHeading">Details</h3>
          <button type="button" class="btn icon-button text-white" id="viewerInfoClose" aria-label="Close details">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
          </button>
        </div>
        <dl class="small mb-0">
          <dt>Filename</dt><dd id="viewerInfoFilename"></dd>
          <dt>File type</dt><dd id="viewerInfoType"></dd>
          <dt>Date</dt><dd><time id="viewerInfoDate"></time></dd>
          <dt>Dimensions</dt><dd id="viewerInfoDimensions"></dd>
          <dt id="viewerInfoDurationLabel" hidden>Duration</dt><dd id="viewerInfoDuration" hidden></dd>
          <dt>Album</dt><dd>{% if album is defined %}{{ album }}{% else %}Not in an album{% endif %}</dd>
        </dl>
      </section>
      <div class="modal-footer border-0 p-0 justify-content-center flex-nowrap gap-1">
        <button type="button" class="btn btn-outline-secondary text-white" id="viewerInfoBtn"
          aria-controls="viewerInfoPanel" aria-expanded="false">
          <i class="bi bi-info-circle" aria-hidden="true"></i>
          <span>Info</span>
        </button>
        <button type="button" class="btn btn-outline-secondary text-white" id="viewerShareBtn"
          title="Anonymous sharing: prototype only" aria-label="Share (prototype only)">
          <i class="bi bi-share" aria-hidden="true"></i>
          <span>Share</span>
        </button>
        <a class="btn btn-outline-secondary text-white" id="viewerDownload" target="_blank" rel="noopener"
          title="Open original to save or download it with your browser">
          <i class="bi bi-download" aria-hidden="true"></i>
          <span>Download</span>
        </a>
        <div class="dropup">
          <button
            type="button"
            class="btn btn-outline-secondary text-white"
            id="viewerMoveBtn"
            data-bs-toggle="dropdown"
            aria-label="Move to album"
            {% if not moveAlbums %}disabled{% endif %}>
            <i class="bi bi-journal-arrow-up" aria-hidden="true"></i>
            <span>Move</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-dark" id="viewerMoveMenu">
          {% for albumName in moveAlbums %}
            <li>
              <button type="button" class="dropdown-item" data-target-album="{{ albumName }}">{{ albumName }}</button>
            </li>
          {% endfor %}
          </ul>
        </div>
        <button type="button" class="btn btn-outline-danger" id="viewerDeleteBtn"
          aria-label="{% if album is defined %}Remove from album{% else %}Delete original{% endif %}">
          <i
            class="{% if album is defined %}bi bi-journal-minus{% else %}bi-trash{% endif %}"
            aria-hidden="true"></i>
          <span>{% if album is defined %}Remove{% else %}Delete{% endif %}</span>
        </button>
      </div>
    </div>
  </div>
</div>
