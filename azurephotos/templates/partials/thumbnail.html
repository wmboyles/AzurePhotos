<div class="col">
    <div class="photo-card position-relative">
        <img src="/thumbnail/{{ media.filename }}"
            title="{{ media.filename }}"
            class="img-fluid img-thumbnail"
            loading="lazy"
            data-full="/fullsize/{{ media.filename }}"
            draggable="false">
        <input class="form-check-input photo-checkbox"
            type="checkbox"
            name="selected_photos"
            value="{{ media.filename }}">
    </div>
</div>
