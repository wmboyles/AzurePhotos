<div class="col">
    <div class="photo-card position-relative">
        <button type="button" class="photo-open" data-filename="{{ media.filename }}"
            data-full="/fullsize/{{ media.filename | urlencode }}" data-media-type="{{ media.type.value }}"
            {% if media.last_modified is defined %}data-date="{{ media.last_modified.isoformat() }}"{% endif %}
            aria-label="View {{ media.filename }}" aria-haspopup="dialog">
            <img src="/thumbnail/{{ media.filename | urlencode }}" title="{{ media.filename }}" class="img-thumbnail d-block w-100 p-0 border-0 object-fit-cover"
                loading="lazy" alt="{{ media.filename }}" draggable="false">
        </button>
        <input class="form-check-input photo-checkbox position-absolute top-0 end-0 m-2" type="checkbox" name="selected_photos"
            value="{{ media.filename }}" aria-label="Select {{ media.filename }}">
    </div>
</div>
